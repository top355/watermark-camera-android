name: 构建 APK

# branches 与 tags **同时**定义时，两类 ref 都会触发（官方文档：只定义其中一类时，
# 未定义那一类完全不触发）。所以推送 `v*` 标签会跑一次完整构建，
# 并在末尾把 APK 发布到 Releases —— 见最后那一步。
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# 顶层保持最小权限。只有 build job 需要写权限，在 job 里单独提升 —— 见下面 permissions。
permissions:
  contents: read

jobs:
  build:
    name: 编译打卡水印相机
    runs-on: ubuntu-latest

    # 建 Release 需要 contents: write。**别指望它默认就能写**：GITHUB_TOKEN 的默认
    # 权限由仓库设置决定（2023 年后新建的仓库默认只读），缺权限时表现为
    #   HTTP 403: Resource not accessible by integration
    # 报错完全看不出是"权限"问题。显式声明。
    permissions:
      contents: write

    steps:
      # ── 底下的 action 版本为什么是这个数？───────────────────────────────
      # Node 20 已弃用。用 node20 的 action 会被强制跑在 Node 24 上，并得到一条
      # 警告注解（Annotations 区那两条）。**主版本升到哪一档要逐个查**，别按同一个
      # 数字套：每个仓库把 node24 放在哪一版是各自决定的。下表是 2026-09-28
      # 逐个读各 tag 的 `action.yml` 里 `runs.using` 得到的：
      #
      #   actions/checkout         node20 止于 v4   → 首个 node24 = v5
      #   actions/setup-java       node20 止于 v4    → 首个 node24 = v5
      #   actions/upload-artifact  node20 止于 **v5** → 首个 node24 = v6   ← 顺手写 v5 治不了
      #   gradle/actions           node20 止于 v4    → 首个 node24 = v5
      #
      # node24 的 action 要求 Actions Runner ≥ 2.327.1（GitHub 托管 runner 总是满足；
      # 换成自建 runner 时才需要注意）。
      #
      # **为什么不干脆一律升到 latest**：`gradle/actions@v6` 把缓存拆成了专有组件
      # `gradle-actions-caching`，升 v6 = 接受 Gradle 商业条款 —— 而 setup-gradle 的
      # 缓存是**默认开启**的。我们只需要清掉弃用警告，不必顺带接受一份许可。
      # （同理 setup-java v6 刚发布一个月且改了 Zulu 发现方式与 `jdkFile` 命名，无必要。）
      - name: 拉取代码
        uses: actions/checkout@v5

      # 守卫：拦住"把本机专用路径提交进仓库"这一类问题。
      #
      # 为什么必须放在 setup-gradle **之前**：这种配置会让 gradle 立刻退出 1
      # ——连 `gradle --version` 都一样。而 setup-gradle 做版本探测时就会调一次
      # gradle，于是报错只剩下一句
      #     Error: The process '/usr/bin/gradle' failed with exit code 1
      # 真实原因（"Value 'D:/jdk-17' given for org.gradle.java.home ... is invalid"）
      # 被埋掉了。2026-09-28 实测栽过这一次，排查一度跑到"GitHub 限速/被墙"上去。
      # 放在这里，同样的错误就会直接指名道姓。
      - name: 守卫：gradle.properties 不许出现本机专用绝对路径
        run: |
          set -e
          bad="$(grep -nE '^[[:space:]]*[^#[:space:]][^=]*=[[:space:]]*[A-Za-z]:[\\/]' gradle.properties || true)"
          if [ -n "$bad" ]; then
            echo "::error::gradle.properties 里有 Windows 专用绝对路径。Linux runner 上 gradle 会立刻退出 1，"
            echo "::error::连 setup-gradle 的版本探测都过不去。请把它挪到用户级 ~/.gradle/gradle.properties。"
            echo "命中行："
            echo "$bad"
            exit 1
          fi
          echo "gradle.properties 干净 ✅（生效内容如下，已略去注释）"
          grep -vE '^[[:space:]]*(#|$)' gradle.properties || true

      # v5 相对 v4 只换了 node24 运行时，inputs 是超集（`distribution` / `java-version`
      # 都在，另多了 jdk-file / set-default / verify-signature），不是破坏性升级。
      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK = $SDK"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager)"
          fi
          echo "sdkmanager = $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'

      # 自检：把"到底用了哪个 Java / 哪个 Gradle"直接写进日志。
      # 这两条也正是最容易出问题的地方（见上面那道守卫），单独成一个**命名步骤**，
      # 万一还炸，步骤名会直接说"环境自检"，而不是含糊的
      # "Run gradle/actions/setup-gradle@v5"。
      - name: 编译环境自检
        run: |
          set -e
          echo "JAVA_HOME = ${JAVA_HOME:-<未设置>}"
          java -version
          echo
          echo "gradle = $(command -v gradle)"
          gradle --version
          echo
          # 发布 Release 那一步靠 gh CLI（GitHub 托管 runner 预装）。在这里打印出来，
          # 万一哪天 runner 镜像变了，日志里当场就能看到，而不是等最后一步才炸。
          echo "gh = $(command -v gh)"
          gh --version

      # **跳过 lintVitalRelease**（与 README 第二节一致）：工程里 lint 配的是
      # abortOnError=false，它拦不住任何问题、也不改变 APK 字节，纯让人干等
      # （本机实测这一项 29 分钟还没结束，跳过后整个 release 构建降到 3 分钟）。
      # 真想看 Lint 就单独跑 `gradle lint`，别挂在出包链路上。
      - name: 编译 debug 与 release
        run: gradle assembleDebug assembleRelease -x lintVitalRelease --no-daemon --stacktrace

      - name: 列出产物
        run: find app/build/outputs/apk -name '*.apk' -print

      # 注意这里是 **v6** 不是 v5：upload-artifact 的 node20 一直延续到 v5，
      # 写成 v5 会继续收到"Node.js 20 is deprecated"那条注解（v5 只是预先支持 node24，
      # 默认仍跑 node20）。v6 的 inputs 与 v4 完全一致（name / path / if-no-files-found），
      # 属于纯粹的运行时升级。
      - name: 上传 debug APK
        uses: actions/upload-artifact@v6
        with:
          name: watermark-camera-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传 release APK
        uses: actions/upload-artifact@v6
        with:
          name: watermark-camera-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ── 推 v* 标签时，把 APK 挂到 Releases 上 ──────────────────────────────
      #
      # **怎么触发**：git tag v1.0 && git push origin v1.0  → 这一步自动跑，
      # 产物出现在 https://github.com/<owner>/<repo>/releases
      #
      # 为什么用 gh CLI 而不是第三方 action（softprops/action-gh-release 之类）：
      # ① 少一个要审计 Node 运行时的依赖 —— 刚为了清掉 "Node.js 20 is deprecated"
      #    注解逐版读过 action.yml，不想再引进来一个（见文件开头那张表）；
      # ② gh 是 GitHub 托管 runner 的预装工具，没有版本漂移问题。
      #
      # **幂等是必须的，不是加分项**：`gh release create` 没有 --clobber 参数
      # （只有 `gh release upload` 有），所以下面两种情况都会让 create 直接失败变红：
      #   ① 同一个 tag 重跑 workflow（比如上一次传到一半失败）；
      #   ② 你先在网页上 Draft a new release 建好了空 release。
      # 所以"已存在"必须分支处理：覆盖资产 + 更新说明。
      - name: 发布到 Releases（仅推 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"          # 例如 v1.0
          VER="${TAG#v}"                  # 例如 1.0
          TITLE="打卡水印相机 ${VER}"
          D=app/build/outputs/apk/debug/app-debug.apk
          R=app/build/outputs/apk/release/app-release.apk
          for f in "$D" "$R"; do
            [ -f "$f" ] || { echo "::error::缺产物 $f"; exit 1; }
          done

          # 资产**文件名**用 ASCII 且带版本号：页面上的下载名、wget/curl 的命令行
          # 都干净，多个版本之间也不会互相覆盖。中文放进"显示标签"（文件名后跟
          # `#标签`），页面上照样显示中文 —— 两边都照顾到。
          A="/tmp/watermark-camera-${VER}-debug.apk"
          B="/tmp/watermark-camera-${VER}-release.apk"
          cp "$D" "$A"
          cp "$R" "$B"
          LA="$A#打卡水印相机 ${VER} · debug（带调试信息，体积大）"
          LB="$B#打卡水印相机 ${VER} · release（推荐装这个）"

          # 提交信息里的 `|` 会破坏下面的 markdown 链接行，先剔掉
          MSG="$(git log -1 --pretty=%s | tr -d '|')"
          {
            echo "两个包都用 debug 签名，**都能直接安装**（release 只是关掉了调试信息）。"
            echo
            echo "| 包 | 大小 | MD5 |"
            echo "|---|---|---|"
            printf '| `%s` | %s B | `%s` |\n' "watermark-camera-${VER}-debug.apk" \
                   "$(stat -c %s "$A")" "$(md5sum "$A" | cut -d' ' -f1)"
            printf '| `%s` | %s B | `%s` |\n' "watermark-camera-${VER}-release.apk" \
                   "$(stat -c %s "$B")" "$(md5sum "$B" | cut -d' ' -f1)"
            echo
            printf '构建自 `%s` — [%s](%s/%s/commit/%s)\n' \
                   "$(git rev-parse --short HEAD)" "$MSG" \
                   "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            echo
            echo "安装：把 apk 传到手机点击安装（首次需允许「安装未知应用」）。"
          } > /tmp/notes.md
          echo "──── 即将发布的说明 ────"
          cat /tmp/notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG 已存在 → 覆盖资产并更新说明"
            # --clobber 会先删同名旧资产再传新的（官方警告：若传输失败，旧资产就没了）。
            # 这里传的是本次刚构建的包，丢了重跑一次即可，可以接受。
            gh release upload "$TAG" "$LA" "$LB" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/notes.md
          else
            echo "Release $TAG 不存在 → 新建"
            # --verify-tag：只在远端确实有这个 tag 时才建。不加的话，gh 会拿默认分支
            # 自动造一个 tag —— 那会把版本号悄悄指到一个错的提交上。
            gh release create "$TAG" --verify-tag \
              --title "$TITLE" --notes-file /tmp/notes.md "$LA" "$LB"
          fi
          echo
          echo "✅ 发布完成：$(gh release view "$TAG" --json url -q .url)"
