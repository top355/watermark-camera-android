org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# 钉住 JDK 17。本机的 JAVA_HOME 指向的是另一个 JDK（实测 jdk-22），
# 用它跑 gradle 会在构建**配置阶段**就炸掉，任何 task 都执行不到：
#   java.lang.ClassCastException: class jdk.internal.loader.ClassLoaders$PlatformClassLoader
#     cannot be cast to class java.net.URLClassLoader
#     at org.gradle.initialization.DefaultJdkToolsInitializer.initializeJdkTools
# 报错长得像"Gradle 版本不兼容"，其实跟代码无关 —— 别去翻 build.gradle。
# 有这行之后，命令行不必再带 -Dorg.gradle.java.home。
org.gradle.java.home=D:/jdk-17

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
