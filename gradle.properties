org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# ⚠️ 这里**故意没有** org.gradle.java.home —— 不要加回来。
#
# 本机的 JAVA_HOME 指向的是另一个 JDK（实测 jdk-22），用它跑 gradle 会在构建的
# **配置阶段**就炸掉，任何 task 都执行不到：
#   java.lang.ClassCastException: class jdk.internal.loader.ClassLoaders$PlatformClassLoader
#     cannot be cast to class java.net.URLClassLoader
#     at org.gradle.initialization.DefaultJdkToolsInitializer.initializeJdkTools
# 报错长得像"Gradle 版本不兼容"，其实跟代码无关 —— 别去翻 build.gradle。
#
# 所以本机确实需要这个设置，但它的值是**本机专用的绝对路径**。一旦写进本文件
# （会被提交），CI 的 Linux runner 上 D:/jdk-17 不存在，后果比"构建失败"更早更难看：
#   · `gradle --version` 都会直接退出 1
#     Value 'D:/jdk-17' given for org.gradle.java.home Gradle property is invalid
#   · 所以 GitHub Actions 会**卡在 gradle/actions/setup-gradle 那一步**（它做版本探测时
#     就会调一次 gradle），只留一句看不懂的
#     Error: The process '/usr/bin/gradle' failed with exit code 1
#   · 2026-09-28 实测踩过，排查方向一度跑到"GitHub 限速/被墙"上去了
#
# 正确的放法是放**用户级**（不进仓库、每台机器各自配）：
#   C:\Users\<你>\.gradle\gradle.properties  ←  写 org.gradle.java.home=D:/jdk-17
# 或命令行临时指定：gradle -Dorg.gradle.java.home=D:/jdk-17 …
# CI 不需要它（setup-java 已经把 JAVA_HOME 设成 temurin 17）。

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
